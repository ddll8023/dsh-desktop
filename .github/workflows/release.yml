name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --publish never
            artifact: dsh-desktop-macos-arm64
          - os: macos-15-intel
            args: --mac --x64 --publish never
            artifact: dsh-desktop-macos-x64
          - os: windows-latest
            args: --win --x64 --publish never --config.compression=store
            artifact: dsh-desktop-windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Resolve plugin versions for cache key
        id: versions
        shell: bash
        run: |
          echo "codex=$(git -C plugins/dsh-codex rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "access=$(git -C plugins/dsh-access-mode rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache DSH runtime
        uses: actions/cache@v4
        with:
          path: |
            resources/node
            resources/runtime
            resources/node.tar.gz
            resources/runtime.tar.gz
            resources/runtime-manifest.json
          key: dsh-runtime-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-${{ steps.versions.outputs.codex }}-${{ steps.versions.outputs.access }}

      - name: Install desktop build dependencies
        run: npm ci

      - name: Prepare platform runtime
        timeout-minutes: 30
        run: npm run prepare:runtime

      - name: Build installer
        timeout-minutes: 30
        run: npx electron-builder ${{ matrix.args }}

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.zip
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install release tooling
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false

      - name: Merge updater metadata
        run: node scripts/merge-update-manifests.mjs dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
